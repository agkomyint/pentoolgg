<svg xmlns="http://www.w3.org/2000/svg" width="20" height="12" viewBox="0 0 20 12">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f00"/>
      <stop offset="1" stop-color="#00f"/>
    </linearGradient>
  </defs>
  <style>.card { stroke: #111; stroke-width: 1; opacity: 0.75; }</style>
  <rect id="gradient-card" class="card" x="2" y="2" width="16" height="8" fill="url(#paint)"/>
