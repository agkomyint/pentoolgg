<svg xmlns="http://www.w3.org/2000/svg" width="20" height="10" viewBox="0 0 20 10">
  <defs>
    <clipPath id="half-clip"><rect x="0" y="0" width="5" height="10"/></clipPath>
    <mask id="solid-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="10" y="0" width="10" height="10" mask-type="alpha">
      <rect x="10" y="0" width="10" height="10" fill="#fff"/>
    </mask>
  </defs>
  <rect id="clipped" x="0" y="0" width="10" height="10" fill="#f00" clip-path="url(#half-clip)"/>
  <rect id="masked" x="10" y="0" width="10" height="10" fill="#00f" mask="url(#solid-mask)"/>
</svg>
