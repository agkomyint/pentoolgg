# Fast linker for local development. rust-lld ships with rustc, so no extra
# install is needed. Scoped to Windows MSVC (the slow default linker); Linux
# and macOS CI targets keep their platform defaults.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# Browser core: 128-bit SIMD (every current browser supports it). IEEE results
# are the same lane by lane, so rendered bytes do not change; blur and fills run
# faster.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
