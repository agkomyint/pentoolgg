[package]
name = "pentool"
version = "0.19.1"
edition = "2021"
# Legacy integration tests are grouped into 12 suites under tests/suites/.
# Milestone-specific integration suites are declared explicitly below so CI
# executes their dedicated format and release coverage.
autotests = false
rust-version = "1.86"
description = "A single-binary, agent-friendly vector pen tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agkomyint/pentoolgg"

[workspace]
members = ["wasm"]
exclude = ["fuzz"]

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
resvg = "0.44"
ttf-parser = "0.24"
serde = { version = "1", features = ["derive"] }
# Exact JSON round trips keep transform coefficients and hashed mask data stable.
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny-skia = "0.11"
svgtypes = "0.15"
kurbo = "0.11"
base64 = "0.22"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
rustybuzz = "0.18"
subsetter = "0.2"
hex = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# IDML (XML) parsing; already in the tree through usvg.
roxmltree = "0.20"
# DNG deflate (compression 8); already in the tree through `zip`.
flate2 = "1"
semver = { version = "1", features = ["serde"] }
wgpu = { version = "24.0.3", optional = true }
pollster = { version = "0.4", optional = true }

# Host-only dependencies: the browser (wasm32) build has no sockets, files or OS RNG.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
directories = "6"
walkdir = "2"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
url = "=2.4.1"
encoding_rs = "=0.8.35"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "deterministic", "portable-dispatch"] }

# Local dev/test: line-only debuginfo (level 1 instead of full level 2) to
# cut compile, link and disk cost. Backtraces keep file/line information.
# Release artifacts keep full settings in the `release` profile below.
[profile.dev]
debug = 1

[profile.release]
lto = true
codegen-units = 1
strip = true

# Local testing only (`cargo build --profile fast`): same optimization level as
# release, but parallel codegen and incremental builds. Release artifacts keep
# the `release` profile above.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[[test]]
name = "suite_01"
path = "tests/suites/suite_01.rs"

