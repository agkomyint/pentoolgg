name: Fuzz
permissions:
  contents: read
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "900"
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run campaigns
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '900' }}
        run: |
          for target in decode_source validate_document operation_stack image_assets processed_record package_verify; do
            cargo fuzz run "$target" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
  advisories:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
