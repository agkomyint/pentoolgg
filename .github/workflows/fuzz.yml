name: Fuzz
# Fuzzing is not a push gate: building six sanitizer targets takes far longer
# than the 30 s each one runs. It runs weekly and on demand.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Build every target once
        run: cargo fuzz build
      - name: Run each target briefly
        run: |
          for target in decode_source validate_document operation_stack image_assets processed_record package_verify; do
            cargo fuzz run "$target" -- -max_total_time=30 -timeout=60 -rss_limit_mb=2048
          done
