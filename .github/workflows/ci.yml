name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo check --all-targets --features gpu --locked
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diffs-${{ matrix.os }}
          path: target/render-diffs
          if-no-files-found: ignore
  policy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
      # Advisories are reported but not blocking: the open findings are transitive
      # (reqwest 0.11 -> h2/rustls, usvg 0.44 -> rustybuzz/ttf-parser) and need major upgrades.
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
  binary-size:
    # Builds the exact binaries the release workflow ships (same runners), checks
    # the size budget, and hands them to the release so it does not rebuild.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary: pentool
          - os: macos-15
            name: aarch64-apple-darwin
            binary: pentool
          - os: windows-latest
            name: x86_64-pc-windows-msvc
            binary: pentool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Check release binary size on every target (40 MB budget since v0.14.0, embeds the WASM preview core)
        shell: bash
        run: sh scripts/check-binary-size.sh target/release/${{ matrix.binary }} 40000000
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          retention-days: 14
          if-no-files-found: error
