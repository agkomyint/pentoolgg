name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  studio-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked Studio dependencies
        working-directory: web-ui
        run: bun install --frozen-lockfile
      - name: Typecheck and build embedded Studio UI
        working-directory: web-ui
        run: bun run build
      - name: Require committed Studio bundle to match its source
        run: git diff --exit-code -- web/studio.html
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo check --all-targets --features gpu --locked
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diffs-${{ matrix.os }}
          path: target/render-diffs
          if-no-files-found: ignore
  policy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
      # Advisories are reported but not blocking: the open findings are transitive
      # (reqwest 0.11 -> h2/rustls, usvg 0.44 -> rustybuzz/ttf-parser) and need major upgrades.
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
  browser-core:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown
      - name: Build browser renderer
        run: cargo build -p pentool-wasm --release --target wasm32-unknown-unknown --locked
      - name: Check browser renderer artifact
        run: test -s target/wasm32-unknown-unknown/release/pentool_wasm.wasm
      - name: Smoke render a painted raster layer in WebAssembly
        run: node scripts/smoke-wasm-raster.mjs target/wasm32-unknown-unknown/release/pentool_wasm.wasm docs/fixtures/raster-v6.pen
      - uses: actions/upload-artifact@v4
        with:
          name: pentool-browser-core
          path: target/wasm32-unknown-unknown/release/pentool_wasm.wasm
          if-no-files-found: error
  binary-size:
    # Builds the exact binaries the release workflow ships (same runners), checks
    # the size budget, and hands them to the release so it does not rebuild.
    timeout-minutes: 30
    needs: browser-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary: pentool
          - os: macos-15
            name: aarch64-apple-darwin
            binary: pentool
          - os: windows-latest
            name: x86_64-pc-windows-msvc
            binary: pentool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: pentool-browser-core
          path: target/browser-core
      - name: Embed browser renderer in release binary
        shell: bash
        run: cp target/browser-core/pentool_wasm.wasm web/pentool_core.wasm
      - run: cargo build --release --locked
      - name: Check release binary size on every target (60 MB budget approved for v0.15.0 GPU work)
        shell: bash
        run: sh scripts/check-binary-size.sh target/release/${{ matrix.binary }} 60000000
      - name: Check static 3D CPU render budget
        shell: bash
        run: ./target/release/${{ matrix.binary }} benchmark --scene3d --triangles 100000 --repetitions 1 --max-ms 30000
      - name: Agent loop against v0.23.0 (byte-identical images, timings in the job summary)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PY=$(command -v python3 || command -v python)
          gh release download v0.23.0 --pattern "pentool-v0.23.0-${{ matrix.name }}.*" --dir "$RUNNER_TEMP/baseline"
          "$PY" -c "import glob,shutil,sys; shutil.unpack_archive(glob.glob(sys.argv[1] + '/pentool-*')[0], sys.argv[1] + '/x')" "$RUNNER_TEMP/baseline"
          baseline=$(find "$RUNNER_TEMP/baseline/x" -name "${{ matrix.binary }}" -type f | head -n 1)
          chmod +x "$baseline"
          "$PY" scripts/bench-agent-loop.py --baseline "$baseline" --pentool target/release/${{ matrix.binary }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          retention-days: 14
          if-no-files-found: error
