name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  verify-ci:
    # The test suite is not repeated here: the tagged commit must already have a
    # successful run of the CI workflow.
    runs-on: ubuntu-latest
    outputs:
      ci_run: ${{ steps.ci.outputs.run }}
    steps:
      - name: Require a passing CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" -q '.total_count')
          echo "successful CI runs for ${{ github.sha }}: $count"
          [ "$count" -ge 1 ] || { echo "tag a commit that has passed CI" >&2; exit 1; }
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" -q '.workflow_runs[0].id')
          echo "run=$run" >> "$GITHUB_OUTPUT"
  build:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: pentool
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: pentool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: pentool.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      BIN: target/${{ matrix.target }}/release/${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Reuse the binary CI built for this exact commit, else build it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=target/${{ matrix.target }}/release
          mkdir -p "$out" ci-bin
          if gh run download "${{ needs.verify-ci.outputs.ci_run }}" -n release-binary-${{ matrix.target }} -D ci-bin              && [ -f "ci-bin/${{ matrix.binary }}" ]; then
            cp "ci-bin/${{ matrix.binary }}" "$out/${{ matrix.binary }}"
            chmod +x "$out/${{ matrix.binary }}"
            echo "reused the CI binary"
          else
            echo "CI binary unavailable; building"
            cargo build -p pentool-wasm --release --locked --target wasm32-unknown-unknown
            cp target/wasm32-unknown-unknown/release/pentool_wasm.wasm web/pentool_core.wasm
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Smoke test CLI rendering
        shell: bash
        run: $BIN export examples/eye.pen smoke.png
      - name: Smoke test native typography
        shell: bash
        run: $BIN export examples/text-demo.pen text-smoke.png
      - name: Smoke test sharp stroke edges
        shell: bash
        run: $BIN export examples/stroke-edges.pen stroke-smoke.png
      - name: Smoke test agent discovery
        shell: bash
        run: $BIN search examples/text-demo.pen subtitle --kind text
      - name: Smoke test v4 tree and search
        shell: bash
        run: |
          "$BIN" tree docs/fixtures/v4-scene.pen --limit 1
          "$BIN" search docs/fixtures/v4-scene.pen semantic --kind text
      - name: Smoke test v4 creation and basic editing
        shell: bash
        run: |
          "$BIN" new v4-smoke.pen --width 320 --height 240
          "$BIN" canvas v4-smoke.pen --width 640
          "$BIN" path v4-smoke.pen put outline --layer layer-1 --d 'M0 0 L10 10' --stroke '#112233' --width 2
          "$BIN" tree v4-smoke.pen
      - name: Smoke test large-document budget
        shell: bash
        run: $BIN benchmark --layers 50 --objects 5000 --max-ms 60000
      - name: Record platform baseline
        shell: bash
        run: |
          bytes=$(wc -c < target/${{ matrix.target }}/release/${{ matrix.binary }})
          hash=$(sha256sum target/${{ matrix.target }}/release/${{ matrix.binary }} | cut -d' ' -f1)
          printf '{"target":"%s","binary_bytes":%s,"binary_sha256":"%s","formats":[1,2,3,4],"benchmark":"50 layers / 5000 objects under 60000 ms"}\n' '${{ matrix.target }}' "$bytes" "$hash" > pentool-${{ github.ref_name }}-${{ matrix.target }}-baseline.json
      - name: Smoke test raster paint
        shell: bash
        run: |
          cp docs/fixtures/v4-scene.pen raster-smoke.pen
          "$BIN" raster raster-smoke.pen add p --width 100 --height 60
          "$BIN" raster raster-smoke.pen stroke p --samples '[[30,30],[60,40]]' --color '#FF0000'
          "$BIN" raster raster-smoke.pen verify p --replay
      - name: Smoke test photography
        shell: bash
        run: |
          cp docs/fixtures/v4-scene.pen photo-smoke.pen
          cp docs/fixtures/photo-dng-rggb16.dng hero.dng
          "$BIN" raw add photo-smoke.pen hero --file hero.dng
          "$BIN" raw develop photo-smoke.pen hero --exposure 0.3
          "$BIN" photo render photo-smoke.pen hero --out photo-smoke.png
          "$BIN" photo place photo-smoke.pen hero --layer content --width 120
          "$BIN" export photo-smoke.pen photo-page.png
          "$BIN" export photo-smoke.pen photo-page.png
          "$BIN" photo export photo-smoke.pen --selection hero --recipe web-gallery --out photo-out
          "$BIN" benchmark --photo --photos 4 --megapixels 0.5 --repetitions 2 --max-ms 60000
      - name: Smoke test pages and import
        shell: bash
        run: |
          cp examples/logo.pen import-smoke.pen
          "$BIN" page import-smoke.pen add assets --name Assets --width 800 --height 600
          "$BIN" --page assets import import-smoke.pen examples/eye.pen --prefix eye --at 40 40
          "$BIN" --page assets search import-smoke.pen eye --limit 2
      - name: Smoke test design interchange import and PSD export
        shell: bash
        run: |
          cp docs/fixtures/v4-scene.pen interchange-source.pen
          "$BIN" new interchange-target.pen --width 320 --height 240
          "$BIN" import interchange-target.pen docs/fixtures/v017-interchange-smoke.svg --prefix svg-smoke --report svg-import-report.json
          "$BIN" export interchange-source.pen interchange-smoke.pdf
          "$BIN" import interchange-target.pen interchange-smoke.pdf --prefix pdf-smoke --report pdf-import-report.json
          "$BIN" export interchange-source.pen interchange-smoke.psd --report psd-export-report.json
          "$BIN" import interchange-target.pen interchange-smoke.psd --prefix psd-smoke --report psd-import-report.json
          "$BIN" import interchange-target.pen docs/fixtures/figma-weather-now-v15.fig --report fig-import-report.json
      - name: Smoke test page layout and IDML
        shell: bash
        run: |
          mkdir -p layout-smoke
          python3 scripts/layout-smoke.py target/${{ matrix.target }}/release/${{ matrix.binary }} layout-smoke || python scripts/layout-smoke.py target/${{ matrix.target }}/release/${{ matrix.binary }} layout-smoke
      - name: Smoke test v11 mockup bindings and packaging export
        shell: bash
        run: |
          cp docs/fixtures/v11-product-packaging.pen packaging-smoke.pen
          "$BIN" scene3d packaging-smoke.pen dependencies --json
          "$BIN" scene3d packaging-smoke.pen render-report perfume-preview --json
          "$BIN" pack packaging-smoke.pen preflight shirt-carton --json
          "$BIN" pack packaging-smoke.pen preview shirt-carton --fold 0.5 --out packaging-preview.png --json
          "$BIN" pack packaging-smoke.pen export shirt-carton --out packaging-flat.svg --json
          "$BIN" color profile import packaging-smoke.pen docs/fixtures/print-CGATS21_CRPC7.icc --name press-coated --redistribution allowed --json
          "$BIN" color role assign packaging-smoke.pen output --to '{"space":"icc-cmyk","profile":"press-coated"}' --intent relative-colorimetric --json
          "$BIN" pack packaging-smoke.pen export-bundle shirt-carton --out packaging-bundle --min-ppi 36 --ppi 36 --fold 0.5 --json
          "$BIN" pack verify-bundle packaging-bundle
      - name: Smoke test outlined typography
        shell: bash
        run: $BIN export examples/text-demo.pen text-smoke.svg --outline-text
      - name: Record binary size
        shell: bash
        run: sh scripts/check-binary-size.sh "$(ls target/${{ matrix.target }}/release/pentool target/${{ matrix.target }}/release/pentool.exe 2>/dev/null | head -1)" 60000000
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/pentool dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cp -R examples docs assets dist/
          tar -czf pentool-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Copy-Item target/${{ matrix.target }}/release/pentool.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Copy-Item examples, docs, assets -Destination dist/ -Recurse
          Compress-Archive -Path dist/* -DestinationPath pentool-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pentool-${{ matrix.target }}
          path: |
            pentool-${{ github.ref_name }}-${{ matrix.target }}.*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
