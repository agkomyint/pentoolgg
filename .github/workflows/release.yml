name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: pentool
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: pentool
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: pentool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: pentool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --all-targets --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test CLI rendering
        run: cargo run --release --locked --target ${{ matrix.target }} -- export examples/eye.pen smoke.png
      - name: Smoke test native typography
        run: cargo run --release --locked --target ${{ matrix.target }} -- export examples/text-demo.pen text-smoke.png
      - name: Smoke test sharp stroke edges
        run: cargo run --release --locked --target ${{ matrix.target }} -- export examples/stroke-edges.pen stroke-smoke.png
      - name: Smoke test agent discovery
        run: cargo run --release --locked --target ${{ matrix.target }} -- search examples/text-demo.pen subtitle --kind text
      - name: Smoke test v4 tree and search
        shell: bash
        run: |
          cargo run --release --locked --target ${{ matrix.target }} -- tree docs/fixtures/v4-scene.pen --limit 1
          cargo run --release --locked --target ${{ matrix.target }} -- search docs/fixtures/v4-scene.pen semantic --kind text
      - name: Smoke test v4 creation and basic editing
        shell: bash
        run: |
          cargo run --release --locked --target ${{ matrix.target }} -- new v4-smoke.pen --width 320 --height 240
          cargo run --release --locked --target ${{ matrix.target }} -- canvas v4-smoke.pen --width 640
          cargo run --release --locked --target ${{ matrix.target }} -- path v4-smoke.pen put outline --layer layer-1 --d 'M0 0 L10 10' --stroke '#112233' --width 2
          cargo run --release --locked --target ${{ matrix.target }} -- tree v4-smoke.pen
      - name: Smoke test large-document budget
        run: cargo run --release --locked --target ${{ matrix.target }} -- benchmark --layers 50 --objects 5000 --max-ms 60000
      - name: Record platform baseline
        shell: bash
        run: |
          bytes=$(wc -c < target/${{ matrix.target }}/release/${{ matrix.binary }})
          hash=$(sha256sum target/${{ matrix.target }}/release/${{ matrix.binary }} | cut -d' ' -f1)
          printf '{"target":"%s","binary_bytes":%s,"binary_sha256":"%s","formats":[1,2,3,4],"benchmark":"50 layers / 5000 objects under 60000 ms"}\n' '${{ matrix.target }}' "$bytes" "$hash" > pentool-${{ github.ref_name }}-${{ matrix.target }}-baseline.json
      - name: Smoke test pages and import
        shell: bash
        run: |
          cp examples/logo.pen import-smoke.pen
          cargo run --release --locked --target ${{ matrix.target }} -- page import-smoke.pen add assets --name Assets --width 800 --height 600
          cargo run --release --locked --target ${{ matrix.target }} -- --page assets import import-smoke.pen examples/eye.pen --prefix eye --at 40 40
          cargo run --release --locked --target ${{ matrix.target }} -- --page assets search import-smoke.pen eye --limit 2
      - name: Smoke test outlined typography
        run: cargo run --release --locked --target ${{ matrix.target }} -- export examples/text-demo.pen text-smoke.svg --outline-text
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/pentool dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cp -R examples docs assets dist/
          tar -czf pentool-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Copy-Item target/${{ matrix.target }}/release/pentool.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Copy-Item examples, docs, assets -Destination dist/ -Recurse
          Compress-Archive -Path dist/* -DestinationPath pentool-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pentool-${{ matrix.target }}
          path: |
            pentool-${{ github.ref_name }}-${{ matrix.target }}.*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
