[package]
name = "pentool-core"
version.workspace = true
edition = "2021"
rust-version = "1.86"
description = "Pentool document model, editing, and deterministic CPU renderer (see docs/architecture.md)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agkomyint/pentoolgg"
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
resvg = "0.44"
ttf-parser = "0.24"
serde = { version = "1", features = ["derive"] }
# Exact JSON round trips keep transform coefficients and hashed mask data stable.
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny-skia = "0.11"
svgtypes = "0.15"
kurbo = "0.11"
base64 = "0.22"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
rustybuzz = "0.18"
subsetter = "0.2"
hex = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# IDML (XML) parsing; already in the tree through usvg.
roxmltree = "0.20"
# DNG deflate (compression 8); already in the tree through `zip`.
flate2 = "1"
semver = { version = "1", features = ["serde"] }
wgpu = { version = "24.0.3", optional = true }
pollster = { version = "0.4", optional = true }

# Host-only dependencies: the browser (wasm32) build has no sockets, files or OS RNG.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
walkdir = "2"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
