<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Pentool — vector canvas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">P</span><strong>Pentool</strong><span class="badge">OPEN SOURCE</span></div>
    <div class="actions">
      <button id="newBtn" title="New document">New</button>
      <label class="button" for="openFile">Open .pen</label><input id="openFile" type="file" accept=".pen,application/json" hidden>
      <button id="saveBtn">Save .pen</button>
      <button id="reloadBtn" hidden>Reload shared</button>
      <button id="exportBtn" class="primary">Export PNG</button>
    </div>
  </header>
  <main class="workspace">
    <nav class="tools" aria-label="Drawing tools">
      <button class="tool active" data-tool="pen" aria-pressed="true" title="Pen (P)"><span aria-hidden="true">✒</span><small>Pen</small></button>
      <button class="tool" data-tool="select" aria-pressed="false" title="Select (V)"><span aria-hidden="true">↖</span><small>Select</small></button>
      <button class="tool" data-tool="hand" aria-pressed="false" title="Hand (H)"><span aria-hidden="true">✋</span><small>Hand</small></button>
    </nav>
    <section class="stage" aria-label="Vector canvas workspace">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="canvas" role="img" aria-label="Vector drawing canvas" tabindex="0"></svg>
      </div>
      <div class="hint" id="hint">Click to place points · drag for curves · Enter to finish · Esc to cancel</div>
    </section>
    <aside class="inspector">
      <section>
        <div class="section-head"><h2>Style</h2></div>
        <label>Stroke <input id="stroke" type="color" value="#111827"></label>
        <label>Width <input id="width" type="range" min="1" max="32" value="3"><output id="widthOut">3 px</output></label>
        <label>Fill <select id="fill"><option value="none">None</option><option value="#111827">Ink</option><option value="#ffffff">White</option></select></label>
        <label>Path <textarea id="pathData" rows="4" placeholder="Select a path to edit its SVG geometry"></textarea></label>
        <button id="applyPath">Apply path geometry</button>
      </section>
      <section>
        <div class="section-head"><h2>Layers</h2><button id="addLayer" class="icon" aria-label="Add layer" title="Add layer">＋</button></div>
        <div id="layers" class="layer-list"></div>
      </section>
      <section class="agent-card">
        <h2>Geometry</h2>
        <label>Target <select id="geometryTarget"><option value="path">Selected path</option><option value="layer">Active layer</option></select></label>
        <label>Move X <input id="moveX" type="number" value="0"></label>
        <label>Move Y <input id="moveY" type="number" value="0"></label>
        <button id="moveGeometry">Move</button>
        <label>Rotate <input id="rotateDegrees" type="number" value="0"></label>
        <button id="rotateGeometry">Rotate about origin</button>
        <label>Scale X <input id="scaleX" type="number" value="1" step="0.1"></label>
        <label>Scale Y <input id="scaleY" type="number" value="1" step="0.1"></label>
        <button id="scaleGeometry">Scale about origin</button>
        <button id="editNodes">Edit anchors / handles</button>
        <div id="nodeEditor"></div>
      </section>
      <section class="agent-card">
        <h2>Agent API</h2>
        <p>Generate paths with JSON, then render them through this server.</p>
        <code>POST /api/render/png</code>
        <code>POST /api/render/svg</code>
      </section>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
